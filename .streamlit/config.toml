[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8FA"
primaryColor = "#0969DA"
textColor = "#1F2328"
linkColor = "#0969DA"
codeTextColor = "#1B7C83"
codeBackgroundColor = "#EAEEF2"
borderColor = "#D0D7DE"
dataframeBorderColor = "#D0D7DE"
dataframeHeaderBackgroundColor = "#EAEEF2"
showWidgetBorder = false

[server]
headless = true

[runner]
# Não correr o coletor de lixo completo (~100 ms com as bibliotecas de ML carregadas) depois de CADA execução do script;
# o coletor automático do Python continua a funcionar.
postScriptGC = false
